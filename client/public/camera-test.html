<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>raw camera test</title>
  </head>
  <body>
    <h1>Raw getUserMedia test (no React, no WebRTC signaling)</h1>
    <video id="v" autoplay playsinline muted style="width: 480px; background: #000"></video>
    <pre id="status">waiting...</pre>
    <script>
      const video = document.getElementById("v");
      const status = document.getElementById("status");

      function updateStatus() {
        status.textContent = JSON.stringify(
          {
            paused: video.paused,
            readyState: video.readyState,
            videoWidth: video.videoWidth,
            videoHeight: video.videoHeight,
          },
          null,
          2,
        );
      }
      setInterval(updateStatus, 500);

      navigator.mediaDevices
        .getUserMedia({ video: true, audio: false })
        .then((stream) => {
          console.log("got stream", stream, stream.getTracks());
          video.srcObject = stream;
          return video.play();
        })
        .then(() => console.log("play() resolved"))
        .catch((error) => {
          console.error("FAILED:", error);
          status.textContent = "ERROR: " + error;
        });
    </script>
  </body>
</html>
